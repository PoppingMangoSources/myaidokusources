<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="PoppingMango Sources for Aidoku">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d9d"/>
      <stop offset="0.5" stop-color="#c04bd6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140a18" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#140a18" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7ab8"/>
      <stop offset="0.55" stop-color="#ff4d9d"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="2" y="2" width="1196" height="296" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="1200" height="300" fill="url(#brand)"/>
    <rect x="0" y="0" width="1200" height="300" fill="url(#scrim)"/>
    <ellipse cx="600" cy="-40" rx="700" ry="150" fill="#a5f3fc" opacity="0.16"/>
    <ellipse cx="1080" cy="320" rx="360" ry="130" fill="#ff9ecb" opacity="0.2"/>
  </g>
  <rect x="2" y="2" width="1196" height="296" rx="26" fill="none" stroke="#a5f3fc" stroke-opacity="0.5" stroke-width="2"/>

  <g transform="translate(150,150)">
    <circle r="78" fill="#ffd6e8"/>
    <circle r="78" fill="none" stroke="#67e8f9" stroke-opacity="0.9" stroke-width="4"/>
    <g transform="rotate(-18)">
      <ellipse cx="0" cy="10" rx="34" ry="44" fill="url(#mango)"/>
      <ellipse cx="-10" cy="-2" rx="12" ry="18" fill="#ffffff" opacity="0.3"/>
      <path d="M2,-32 C4,-44 10,-50 16,-54" fill="none" stroke="#0e9bb5" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="26" cy="-52" rx="14" ry="7" fill="#22d3ee" transform="rotate(24 26 -52)"/>
    </g>
  </g>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="270" y="150" font-size="64" font-weight="800">PoppingMango Sources</text>
    <text x="272" y="205" font-size="25" font-weight="700" letter-spacing="4" opacity="0.96">NOVELS · MANGA · MANHWA · MANHUA</text>
    <text x="272" y="245" font-size="21" font-weight="600" letter-spacing="2" opacity="0.92">AIDOKU CLONES OF THE PAPERBACK SOURCES</text>
  </g>
</svg>
